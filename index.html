<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TV & Radio Schedule</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            indigo: {
              50: '#eef2ff',
              100: '#e0e7ff',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- DOMPurify (XSS Protection) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
  
  <style>
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 地域リスト
    const REGIONS = [
      { code: '130', name: '東京都' },
      { code: '270', name: '大阪府' },
      { code: '230', name: '愛知県' },
      { code: '400', name: '福岡県' },
      { code: '010', name: '北海道' }
    ];

    // 放送局リスト（地域名を表示に反映できる構造に拡張）
    const getStationsForRegion = (regionName) => [
      { id: 'tv_nhk', name: `NHK総合 (${regionName})`, mediaType: 'TV_TERRESTRIAL' },
      { id: 'tv_e', name: 'NHKEテレ', mediaType: 'TV_TERRESTRIAL' },
      { id: 'tv_key', name: regionName === '大阪府' ? '読売テレビ' : regionName === '愛知県' ? '中京テレビ' : '日本テレビ', mediaType: 'TV_TERRESTRIAL' },
      { id: 'radio_tbs', name: regionName === '大阪府' ? 'MBSラジオ' : 'TBSラジオ', mediaType: 'RADIO' },
      { id: 'radio_jwave', name: regionName === '大阪府' ? 'FM802' : 'J-WAVE', mediaType: 'RADIO' }
    ];

    // 地域・日付に合わせて朝6:00〜深夜24:00までの番組データを動的生成
    const generateFullSchedule = (regionName, dateStr) => {
      const base = new Date(dateStr || new Date());
      const createIso = (h, m) => {
        const d = new Date(base);
        d.setHours(h, m, 0, 0);
        return d.toISOString();
      };

      const stations = getStationsForRegion(regionName);
      const programs = [];

      // 各局ごとに終日の番組テーブルを動的に生成
      stations.forEach((st) => {
        if (st.id === 'tv_nhk') {
          programs.push(
            { id: `${st.id}_1`, stationId: st.id, title: `モーニングニュース＆お天気 (${regionName})`, description: `${regionName}の朝のニュースと詳細な気象情報をLIVEでお伝えします。`, startTime: createIso(6, 0), endTime: createIso(8, 0), durationMinutes: 120, performers: ['キャスターA'], genre: 'ニュース' },
            { id: `${st.id}_2`, stationId: st.id, title: '連続テレビ小説ガイド', description: '話題のドラマのハイライトと舞台裏。', startTime: createIso(8, 0), endTime: createIso(8, 15), durationMinutes: 15, performers: ['女優B'], genre: 'ドラマ' },
            { id: `${st.id}_3`, stationId: st.id, title: '生活情報バラエティ', description: '日常に役立つお得な生活アイデアを特集。', startTime: createIso(8, 15), endTime: createIso(10, 0), durationMinutes: 105, performers: ['タレントC'], genre: 'バラエティ' },
            { id: `${st.id}_4`, stationId: st.id, title: '正午の全国ニュース', description: '国内外の最新動向をわかりやすく解説。', startTime: createIso(12, 0), endTime: createIso(13, 0), durationMinutes: 60, performers: ['アナウンサーD'], genre: 'ニュース' },
            { id: `${st.id}_5`, stationId: st.id, title: '大相撲・スポーツ中継', description: '本日のハイライトと熱戦の模様。', startTime: createIso(16, 0), endTime: createIso(18, 0), durationMinutes: 120, performers: ['解説E'], genre: 'スポーツ' },
            { id: `${st.id}_6`, stationId: st.id, title: 'ニュース7', description: '一日の主要ニュースをダイジェストで。', startTime: createIso(19, 0), endTime: createIso(20, 0), durationMinutes: 60, performers: ['キャスターF'], genre: 'ニュース' },
            { id: `${st.id}_7`, stationId: st.id, title: 'スペシャルドキュメンタリー', description: '現代社会の課題に迫る密着取材。', startTime: createIso(20, 0), endTime: createIso(22, 0), durationMinutes: 120, performers: ['ナビゲーターG'], genre: 'ドキュメンタリー' }
          );
        } else if (st.id === 'tv_e') {
          programs.push(
            { id: `${st.id}_1`, stationId: st.id, title: 'キッズサイエンス＆アニメ', description: '楽しく学べる子ども向け教育番組。', startTime: createIso(7, 0), endTime: createIso(8, 30), durationMinutes: 90, performers: ['キャラクターH'], genre: 'アニメ・教育' },
            { id: `${st.id}_2`, stationId: st.id, title: '高校講座・理科講座', description: 'わかりやすい高校基礎講座。', startTime: createIso(10, 0), endTime: createIso(12, 0), durationMinutes: 120, performers: ['講師I'], genre: '教育' },
            { id: `${st.id}_3`, stationId: st.id, title: 'クラシック音楽への招待', description: '世界最高峰のオーケストラ演奏。', startTime: createIso(21, 0), endTime: createIso(23, 0), durationMinutes: 120, performers: ['指揮者J'], genre: '音楽' }
          );
        } else if (st.id === 'tv_key') {
          programs.push(
            { id: `${st.id}_1`, stationId: st.id, title: `朝の情報バラエティ [${st.name}]`, description: 'エンタメ情報や最新トレンドを徹底検証！', startTime: createIso(6, 0), endTime: createIso(9, 0), durationMinutes: 180, performers: ['MC K', 'ゲストL'], genre: 'バラエティ' },
            { id: `${st.id}_2`, stationId: st.id, title: '昼のワイドショー', description: '世間の話題を独自の視点で生討論。', startTime: createIso(11, 55), endTime: createIso(13, 55), durationMinutes: 120, performers: ['コメンテーターM'], genre: '情報' },
            { id: `${st.id}_3`, stationId: st.id, title: 'ゴールデンバラエティ2時間SP', description: '大人気クイズ＆グルメバトル！', startTime: createIso(19, 0), endTime: createIso(21, 0), durationMinutes: 120, performers: ['芸人N'], genre: 'バラエティ' },
            { id: `${st.id}_4`, stationId: st.id, title: 'ナイトドラマ', description: '予測不能のミステリードラマ第5話。', startTime: createIso(22, 0), endTime: createIso(23, 0), durationMinutes: 60, performers: ['主演O'], genre: 'ドラマ' }
          );
        } else if (st.id === 'radio_tbs') {
          programs.push(
            { id: `${st.id}_1`, stationId: st.id, title: `朝のワイドラジオ (${st.name})`, description: '通勤・通学のお供に爽やかな音楽と最新トピックス。', startTime: createIso(6, 0), endTime: createIso(8, 30), durationMinutes: 150, performers: ['DJ P'], genre: 'ラジオ' },
            { id: `${st.id}_2`, stationId: st.id, title: '午後のトークパートナー', description: 'リスナーからのお便り紹介と生電話コーナー。', startTime: createIso(13, 0), endTime: createIso(15, 30), durationMinutes: 150, performers: ['パーソナリティQ'], genre: 'ラジオ' },
            { id: `${st.id}_3`, stationId: st.id, title: 'オールナイトミュージック', description: '深夜の静寂を彩る名曲選。', startTime: createIso(22, 0), endTime: createIso(24, 0), durationMinutes: 120, performers: ['選曲家R'], genre: '音楽' }
          );
        } else {
          programs.push(
            { id: `${st.id}_1`, stationId: st.id, title: `TOKYO / AREA MORNING [${st.name}]`, description: 'ノンストップ・最新ヒットチャート。', startTime: createIso(6, 0), endTime: createIso(9, 0), durationMinutes: 180, performers: ['DJ S'], genre: '音楽' },
            { id: `${st.id}_2`, stationId: st.id, title: 'ノンストップMUSIC DRIVE', description: 'ドライビングに最適な最新洋楽&邦楽ミックス。', startTime: createIso(14, 0), endTime: createIso(17, 0), durationMinutes: 180, performers: ['DJ T'], genre: '音楽' },
            { id: `${st.id}_3`, stationId: st.id, title: 'NIGHT LOUNGE JAZZ', description: '極上のジャズで過ごす大人の夜。', startTime: createIso(20, 0), endTime: createIso(23, 0), durationMinutes: 180, performers: ['ナビゲーターU'], genre: 'ジャズ' }
          );
        }
      });

      return { stations, programs };
    };

    // カレンダー出力クラス
    class CalendarExporter {
      static formatDateToUtcString(isoString) {
        const date = new Date(isoString);
        return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      }

      static generateGoogleCalendarUrl(payload) {
        const startUtc = this.formatDateToUtcString(payload.startIso);
        const endUtc = this.formatDateToUtcString(payload.endIso);
        const baseUrl = 'https://calendar.google.com/calendar/render';
        const params = new URLSearchParams({
          action: 'TEMPLATE',
          text: payload.title,
          dates: `${startUtc}/${endUtc}`,
          details: payload.description,
          location: payload.location
        });
        return `${baseUrl}?${params.toString()}`;
      }

      static downloadIcsFile(payload) {
        const startUtc = this.formatDateToUtcString(payload.startIso);
        const endUtc = this.formatDateToUtcString(payload.endIso);
        const nowUtc = this.formatDateToUtcString(new Date().toISOString());

        const icsContent = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//TV Radio Schedule App//NONSGML v1.0//JA',
          'CALSCALE:GREGORIAN',
          'METHOD:PUBLISH',
          'BEGIN:VEVENT',
          `UID:${Date.now()}@tv-radio-app`,
          `DTSTAMP:${nowUtc}`,
          `DTSTART:${startUtc}`,
          `DTEND:${endUtc}`,
          `SUMMARY:${payload.title}`,
          `DESCRIPTION:${payload.description}`,
          `LOCATION:${payload.location}`,
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute('download', `${payload.title}.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    // モーダル
    const ProgramModal = ({ program, station, onClose }) => {
      if (!program) return null;

      const sanitizedDescription = DOMPurify.sanitize(program.description);
      const formatTime = (iso) => new Date(iso).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      const handleRegister = (type) => {
        const payload = {
          title: program.title,
          description: `${program.description}\n\n【出演】${program.performers.join(', ')}`,
          location: station ? station.name : 'テレビ/ラジオ放送',
          startIso: program.startTime,
          endIso: program.endTime
        };

        if (type === 'GOOGLE') {
          window.open(CalendarExporter.generateGoogleCalendarUrl(payload), '_blank');
        } else {
          CalendarExporter.downloadIcsFile(payload);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/70 backdrop-blur-sm p-0 sm:p-4">
          <div className="bg-slate-900 rounded-t-2xl sm:rounded-xl max-w-lg w-full shadow-2xl border border-slate-800 overflow-hidden transform transition-all max-h-[85vh] flex flex-col">
            <div className="w-12 h-1.5 bg-slate-700 rounded-full mx-auto my-2 sm:hidden flex-none"></div>
            
            <div className="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center flex-none">
              <span className="text-sm font-bold text-indigo-400">
                {station ? station.name : '放送局'}
              </span>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-200">
                ✕
              </button>
            </div>

            <div className="p-5 space-y-4 overflow-y-auto flex-1">
              <h2 className="text-lg font-bold text-white leading-tight">
                {program.title}
              </h2>
              <div className="text-xs font-semibold text-indigo-400">
                {formatTime(program.startTime)} 〜 {formatTime(program.endTime)} ({program.durationMinutes}分)
              </div>
              <div className="text-xs sm:text-sm text-slate-300 leading-relaxed" dangerouslySetInnerHTML={{ __html: sanitizedDescription }} />
              {program.performers.length > 0 && (
                <div className="pt-2 border-t border-slate-800 text-xs text-slate-400">
                  <span className="font-bold">出演:</span> {program.performers.join(' / ')}
                </div>
              )}
            </div>

            <div className="bg-slate-800/50 p-4 border-t border-slate-800 flex flex-col sm:flex-row gap-2 justify-end flex-none">
              <button onClick={() => handleRegister('GOOGLE')} className="w-full sm:w-auto px-4 py-2.5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition">
                Google カレンダーに登録
              </button>
              <button onClick={() => handleRegister('ICS')} className="w-full sm:w-auto px-4 py-2.5 text-xs font-bold text-slate-200 bg-slate-800 border border-slate-700 rounded-xl transition">
                .ICS 出力
              </button>
            </div>
          </div>
        </div>
      );
    };

    // メインコンポーネント
    const App = () => {
      const [selectedRegionCode, setSelectedRegionCode] = useState('130');
      const [selectedDate, setSelectedDate] = useState('2026-09-26');
      const [selectedStationId, setSelectedStationId] = useState('tv_nhk');
      const [viewMode, setViewMode] = useState('grid');
      const [selectedProgram, setSelectedProgram] = useState(null);

      // 選択中の地域名を取得
      const currentRegionName = useMemo(() => {
        const found = REGIONS.find(r => r.code === selectedRegionCode);
        return found ? found.name : '東京都';
      }, [selectedRegionCode]);

      // 地域や日付が変更されたらデータを再作成
      const { stations, programs } = useMemo(() => {
        return generateFullSchedule(currentRegionName, selectedDate);
      }, [currentRegionName, selectedDate]);

      const programsByStation = useMemo(() => {
        const map = new Map();
        stations.forEach(s => map.set(s.id, []));
        programs.forEach(p => {
          const list = map.get(p.stationId);
          if (list) list.push(p);
        });
        return map;
      }, [stations, programs]);

      const HOUR_HEIGHT = 100;
      // 朝6時〜深夜24時（18時間分）を表示
      const hours = Array.from({ length: 18 }, (_, i) => (6 + i) % 24);

      const formatTime = (iso) => new Date(iso).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      return (
        <div className="max-w-7xl mx-auto p-4 sm:p-6 space-y-4">
          {/* ヘッダー・コントロール */}
          <header className="bg-slate-900 p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h1 className="text-xl sm:text-2xl font-black text-indigo-400">TV & Radio Schedule</h1>
              <p className="text-xs text-slate-400 mt-1">番組のコマをクリックしてカレンダーに登録できます</p>
            </div>
            
            <div className="flex flex-wrap gap-2 w-full md:w-auto">
              {/* 地域選択 */}
              <select 
                value={selectedRegionCode} 
                onChange={(e) => setSelectedRegionCode(e.target.value)} 
                className="bg-slate-800 text-white text-xs font-bold p-2.5 rounded-xl border border-slate-700 outline-none cursor-pointer"
              >
                {REGIONS.map(r => <option key={r.code} value={r.code}>{r.name}</option>)}
              </select>

              {/* 日付選択 */}
              <input 
                type="date" 
                value={selectedDate} 
                onChange={(e) => setSelectedDate(e.target.value)} 
                className="bg-slate-800 text-white text-xs font-bold p-2.5 rounded-xl border border-slate-700 outline-none cursor-pointer"
              />
            </div>
          </header>

          {/* 局切り替え＆ビュー切り替え */}
          <div className="flex justify-between items-center bg-slate-900 p-2 rounded-xl border border-slate-800">
            <div className="flex space-x-1 overflow-x-auto scrollbar-none py-1">
              {stations.map(s => (
                <button
                  key={s.id}
                  onClick={() => setSelectedStationId(s.id)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition ${
                    selectedStationId === s.id ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'
                  }`}
                >
                  {s.name}
                </button>
              ))}
            </div>

            <div className="flex space-x-1 bg-slate-800 p-1 rounded-lg flex-none">
              <button 
                onClick={() => setViewMode('grid')} 
                className={`px-2.5 py-1 text-xs font-bold rounded ${viewMode === 'grid' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400'}`}
              >
                表
              </button>
              <button 
                onClick={() => setViewMode('list')} 
                className={`px-2.5 py-1 text-xs font-bold rounded ${viewMode === 'list' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400'}`}
              >
                リスト
              </button>
            </div>
          </div>

          {/* メイン番組表エリア */}
          {viewMode === 'list' ? (
            <div className="space-y-2">
              {(programsByStation.get(selectedStationId) || []).map(prog => (
                <div 
                  key={prog.id} 
                  onClick={() => setSelectedProgram(prog)}
                  className="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-sm cursor-pointer hover:border-indigo-500 transition"
                >
                  <div className="text-xs font-bold text-indigo-400 mb-1">
                    {formatTime(prog.startTime)} 〜 {formatTime(prog.endTime)} ({prog.durationMinutes}分)
                  </div>
                  <h3 className="font-bold text-sm text-white">{prog.title}</h3>
                  <p className="text-xs text-slate-400 mt-1 line-clamp-2">{prog.description}</p>
                </div>
              ))}
            </div>
          ) : (
            <div className="relative w-full overflow-x-auto border border-slate-800 rounded-xl bg-slate-900 shadow-md">
              <div className="inline-flex min-w-full">
                {/* 時間軸 */}
                <div className="w-12 flex-none bg-slate-800 border-r border-slate-700 sticky left-0 z-20">
                  <div className="h-10 border-b border-slate-700 flex items-center justify-center font-bold text-[10px] text-slate-400">
                    時
                  </div>
                  <div className="relative" style={{ height: `${18 * HOUR_HEIGHT}px` }}>
                    {hours.map((h, i) => (
                      <div key={h} className="absolute w-full border-b border-slate-700/60 text-[10px] text-slate-400 pl-1 pt-0.5" style={{ top: `${i * HOUR_HEIGHT}px`, height: `${HOUR_HEIGHT}px` }}>
                        {h}:00
                      </div>
                    ))}
                  </div>
                </div>

                {/* 番組グリッド */}
                <div className="flex flex-1">
                  {stations.map(st => (
                    <div key={st.id} className="w-40 sm:w-48 flex-none border-r border-slate-800 relative">
                      <div className="h-10 border-b border-slate-700 bg-slate-800 flex items-center justify-center font-bold text-xs text-slate-200 sticky top-0 z-10">
                        {st.name}
                      </div>
                      <div className="relative" style={{ height: `${18 * HOUR_HEIGHT}px` }}>
                        {/* グリッド背景線 */}
                        {hours.map((_, i) => (
                          <div key={i} className="absolute w-full border-b border-slate-800/40 pointer-events-none" style={{ top: `${i * HOUR_HEIGHT}px`, height: `${HOUR_HEIGHT}px` }}></div>
                        ))}

                        {(programsByStation.get(st.id) || []).map(prog => {
                          const start = new Date(prog.startTime);
                          const startMin = (start.getHours() - 6) * 60 + start.getMinutes();
                          const top = startMin * (HOUR_HEIGHT / 60);
                          const height = prog.durationMinutes * (HOUR_HEIGHT / 60);

                          return (
                            <button
                              key={prog.id}
                              onClick={() => setSelectedProgram(prog)}
                              style={{ top: `${top}px`, height: `${height - 2}px` }}
                              className="absolute left-1 right-1 p-2 rounded-lg bg-slate-800/90 hover:bg-indigo-950/60 border border-slate-700 hover:border-indigo-500 text-left overflow-hidden transition shadow-sm group"
                            >
                              <div className="text-[11px] font-bold text-indigo-300 group-hover:text-indigo-200 line-clamp-1">{prog.title}</div>
                              <div className="text-[9px] text-slate-400 mt-0.5 line-clamp-2">{prog.description}</div>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          <ProgramModal program={selectedProgram} station={stations.find(s => s.id === selectedProgram?.stationId)} onClose={() => setSelectedProgram(null)} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
