<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TV & Radio Schedule</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            indigo: {
              50: '#eef2ff',
              100: '#e0e7ff',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (In-browser JSX compilation) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- DOMPurify (XSS Protection) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* カスタムスクロールバー制御 */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- モックデータ定義 ---
    const REGIONS = [
      { code: '130', name: '東京都' },
      { code: '270', name: '大阪府' },
      { code: '230', name: '愛知県' },
      { code: '400', name: '福岡県' },
      { code: '010', name: '北海道' }
    ];

    const STATIONS = [
      { id: 'tv_nhk', name: 'NHK総合', mediaType: 'TV_TERRESTRIAL' },
      { id: 'tv_e', name: 'NHKEテレ', mediaType: 'TV_TERRESTRIAL' },
      { id: 'tv_ntv', name: '日本テレビ', mediaType: 'TV_TERRESTRIAL' },
      { id: 'radio_tbs', name: 'TBSラジオ', mediaType: 'RADIO' },
      { id: 'radio_jwave', name: 'J-WAVE', mediaType: 'RADIO' }
    ];

    const generateMockPrograms = (dateStr) => {
      const base = new Date(dateStr || new Date());
      const createIso = (h, m) => {
        const d = new Date(base);
        d.setHours(h, m, 0, 0);
        return d.toISOString();
      };

      return [
        {
          id: 'prog_1',
          stationId: 'tv_nhk',
          title: 'モーニングニュース＆お天気情報',
          description: '全国の最新ニュースと詳細な気象情報をLIVEでお伝えします。',
          startTime: createIso(6, 0),
          endTime: createIso(8, 0),
          durationMinutes: 120,
          performers: ['アナウンサーA', '気象予報士B'],
          genre: 'ニュース'
        },
        {
          id: 'prog_2',
          stationId: 'tv_nhk',
          title: '連続テレビドラマガイド',
          description: '話題のドラマのハイライトとインタビュー。',
          startTime: createIso(8, 0),
          endTime: createIso(8, 15),
          durationMinutes: 15,
          performers: ['俳優C'],
          genre: 'ドラマ'
        },
        {
          id: 'prog_3',
          stationId: 'tv_ntv',
          title: '朝の情報バラエティ',
          description: '最新のトレンドスイーツと芸能情報を特集！',
          startTime: createIso(6, 0),
          endTime: createIso(9, 0),
          durationMinutes: 180,
          performers: ['MC D', 'タレントE'],
          genre: 'バラエティ'
        },
        {
          id: 'prog_4',
          stationId: 'radio_tbs',
          title: '朝のモーニングラジオ',
          description: '爽やかな音楽と耳寄りな交通情報をお届け。',
          startTime: createIso(6, 0),
          endTime: createIso(8, 30),
          durationMinutes: 150,
          performers: ['DJ F'],
          genre: 'ラジオ'
        }
      ];
    };

    // --- カレンダー出力クラス ---
    class CalendarExporter {
      static formatDateToUtcString(isoString) {
        const date = new Date(isoString);
        return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      }

      static generateGoogleCalendarUrl(payload) {
        const startUtc = this.formatDateToUtcString(payload.startIso);
        const endUtc = this.formatDateToUtcString(payload.endIso);
        const baseUrl = 'https://calendar.google.com/calendar/render';
        const params = new URLSearchParams({
          action: 'TEMPLATE',
          text: payload.title,
          dates: `${startUtc}/${endUtc}`,
          details: payload.description,
          location: payload.location
        });
        return `${baseUrl}?${params.toString()}`;
      }

      static downloadIcsFile(payload) {
        const startUtc = this.formatDateToUtcString(payload.startIso);
        const endUtc = this.formatDateToUtcString(payload.endIso);
        const nowUtc = this.formatDateToUtcString(new Date().toISOString());

        const icsContent = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//TV Radio Schedule App//NONSGML v1.0//JA',
          'CALSCALE:GREGORIAN',
          'METHOD:PUBLISH',
          'BEGIN:VEVENT',
          `UID:${Date.now()}@tv-radio-app`,
          `DTSTAMP:${nowUtc}`,
          `DTSTART:${startUtc}`,
          `DTEND:${endUtc}`,
          `SUMMARY:${payload.title}`,
          `DESCRIPTION:${payload.description}`,
          `LOCATION:${payload.location}`,
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute('download', `${payload.title}.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    // --- モーダルコンポーネント ---
    const ProgramModal = ({ program, station, onClose }) => {
      if (!program) return null;

      const sanitizedDescription = DOMPurify.sanitize(program.description);
      const formatTime = (iso) => new Date(iso).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      const handleRegister = (type) => {
        const payload = {
          title: program.title,
          description: `${program.description}\n\n【出演】${program.performers.join(', ')}`,
          location: station ? station.name : 'テレビ/ラジオ放送',
          startIso: program.startTime,
          endIso: program.endTime
        };

        if (type === 'GOOGLE') {
          window.open(CalendarExporter.generateGoogleCalendarUrl(payload), '_blank');
        } else {
          CalendarExporter.downloadIcsFile(payload);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm p-0 sm:p-4">
          <div className="bg-white dark:bg-slate-900 rounded-t-2xl sm:rounded-xl max-w-lg w-full shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden transform transition-all max-h-[85vh] flex flex-col">
            <div className="w-12 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto my-2 sm:hidden flex-none"></div>
            
            <div className="bg-slate-100 dark:bg-slate-800 p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center flex-none">
              <span className="text-sm font-bold text-indigo-600 dark:text-indigo-400">
                {station ? station.name : '放送局'}
              </span>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                ✕
              </button>
            </div>

            <div className="p-5 space-y-4 overflow-y-auto flex-1">
              <h2 className="text-lg font-bold text-slate-900 dark:text-white leading-tight">
                {program.title}
              </h2>
              <div className="text-xs font-semibold text-indigo-600 dark:text-indigo-400">
                {formatTime(program.startTime)} 〜 {formatTime(program.endTime)} ({program.durationMinutes}分)
              </div>
              <div className="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed" dangerouslySetInnerHTML={{ __html: sanitizedDescription }} />
              {program.performers.length > 0 && (
                <div className="pt-2 border-t border-slate-100 dark:border-slate-800 text-xs text-slate-500">
                  <span className="font-bold">出演:</span> {program.performers.join(' / ')}
                </div>
              )}
            </div>

            <div className="bg-slate-50 dark:bg-slate-800/50 p-4 border-t border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row gap-2 justify-end flex-none">
              <button onClick={() => handleRegister('GOOGLE')} className="w-full sm:w-auto px-4 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition">
                Google カレンダーに登録
              </button>
              <button onClick={() => handleRegister('ICS')} className="w-full sm:w-auto px-4 py-2 text-xs font-bold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl transition">
                .ICS 出力
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- メインアプリコンポーネント ---
    const App = () => {
      const [selectedRegion, setSelectedRegion] = useState('130');
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [selectedStationId, setSelectedStationId] = useState(STATIONS[0].id);
      const [viewMode, setViewMode] = useState('grid'); // 'grid' | 'list'
      const [selectedProgram, setSelectedProgram] = useState(null);

      const programs = useMemo(() => generateMockPrograms(selectedDate), [selectedDate]);

      const programsByStation = useMemo(() => {
        const map = new Map();
        STATIONS.forEach(s => map.set(s.id, []));
        programs.forEach(p => {
          const list = map.get(p.stationId);
          if (list) list.push(p);
        });
        return map;
      }, [programs]);

      const HOUR_HEIGHT = 100;
      const hours = Array.from({ length: 18 }, (_, i) => (6 + i) % 24);

      const formatTime = (iso) => new Date(iso).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      return (
        <div className="max-w-7xl mx-auto p-4 sm:p-6 space-y-4">
          {/* ヘッダー */}
          <header className="bg-white dark:bg-slate-900 p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h1 className="text-xl sm:text-2xl font-black text-indigo-600 dark:text-indigo-400">TV & Radio Schedule</h1>
              <p className="text-xs text-slate-500 mt-1">番組のコマをクリックしてカレンダーに登録できます</p>
            </div>
            
            <div className="flex flex-wrap gap-2 w-full md:w-auto">
              <select 
                value={selectedRegion} 
                onChange={(e) => setSelectedRegion(e.target.value)} 
                className="bg-slate-100 dark:bg-slate-800 text-xs font-bold p-2.5 rounded-xl border-none outline-none"
              >
                {REGIONS.map(r => <option key={r.code} value={r.code}>{r.name}</option>)}
              </select>

              <input 
                type="date" 
                value={selectedDate} 
                onChange={(e) => setSelectedDate(e.target.value)} 
                className="bg-slate-100 dark:bg-slate-800 text-xs font-bold p-2.5 rounded-xl border-none outline-none"
              />
            </div>
          </header>

          {/* ビュー＆局切り替え */}
          <div className="flex justify-between items-center bg-white dark:bg-slate-900 p-2 rounded-xl border border-slate-200 dark:border-slate-800">
            <div className="flex space-x-1 overflow-x-auto scrollbar-none py-1">
              {STATIONS.map(s => (
                <button
                  key={s.id}
                  onClick={() => setSelectedStationId(s.id)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition ${
                    selectedStationId === s.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
                  }`}
                >
                  {s.name}
                </button>
              ))}
            </div>

            <div className="flex space-x-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
              <button 
                onClick={() => setViewMode('grid')} 
                className={`px-2 py-1 text-xs font-bold rounded ${viewMode === 'grid' ? 'bg-white dark:bg-slate-700 shadow-sm' : 'text-slate-400'}`}
              >
                表
              </button>
              <button 
                onClick={() => setViewMode('list')} 
                className={`px-2 py-1 text-xs font-bold rounded ${viewMode === 'list' ? 'bg-white dark:bg-slate-700 shadow-sm' : 'text-slate-400'}`}
              >
                リスト
              </button>
            </div>
          </div>

          {/* メイン表示エリア */}
          {viewMode === 'list' ? (
            <div className="space-y-2">
              {(programsByStation.get(selectedStationId) || []).map(prog => (
                <div 
                  key={prog.id} 
                  onClick={() => setSelectedProgram(prog)}
                  className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm cursor-pointer hover:border-indigo-500 transition"
                >
                  <div className="text-xs font-bold text-indigo-600 mb-1">
                    {formatTime(prog.startTime)} 〜 {formatTime(prog.endTime)} ({prog.durationMinutes}分)
                  </div>
                  <h3 className="font-bold text-sm text-slate-900 dark:text-white">{prog.title}</h3>
                  <p className="text-xs text-slate-500 mt-1 line-clamp-2">{prog.description}</p>
                </div>
              ))}
            </div>
          ) : (
            <div className="relative w-full overflow-x-auto border border-slate-200 dark:border-slate-800 rounded-xl bg-white dark:bg-slate-900 shadow-md">
              <div className="inline-flex min-w-full">
                {/* 時間軸 */}
                <div className="w-12 flex-none bg-slate-100 dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 sticky left-0 z-20">
                  <div className="h-10 border-b border-slate-200 dark:border-slate-700 flex items-center justify-center font-bold text-[10px] text-slate-400">
                    時
                  </div>
                  <div className="relative" style={{ height: `${18 * HOUR_HEIGHT}px` }}>
                    {hours.map((h, i) => (
                      <div key={h} className="absolute w-full border-b border-slate-200 dark:border-slate-700 text-[10px] text-slate-400 pl-1 pt-0.5" style={{ top: `${i * HOUR_HEIGHT}px`, height: `${HOUR_HEIGHT}px` }}>
                        {h}:00
                      </div>
                    ))}
                  </div>
                </div>

                {/* 番組グリッド */}
                <div className="flex flex-1">
                  {STATIONS.map(st => (
                    <div key={st.id} className="w-36 sm:w-48 flex-none border-r border-slate-200 dark:border-slate-800 relative">
                      <div className="h-10 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 flex items-center justify-center font-bold text-xs text-slate-700 dark:text-slate-300 sticky top-0 z-10">
                        {st.name}
                      </div>
                      <div className="relative" style={{ height: `${18 * HOUR_HEIGHT}px` }}>
                        {(programsByStation.get(st.id) || []).map(prog => {
                          const start = new Date(prog.startTime);
                          const startMin = (start.getHours() - 6) * 60 + start.getMinutes();
                          const top = startMin * (HOUR_HEIGHT / 60);
                          const height = prog.durationMinutes * (HOUR_HEIGHT / 60);

                          return (
                            <button
                              key={prog.id}
                              onClick={() => setSelectedProgram(prog)}
                              style={{ top: `${top}px`, height: `${height - 2}px` }}
                              className="absolute left-1 right-1 p-2 rounded bg-indigo-50 hover:bg-indigo-100 dark:bg-slate-800 dark:hover:bg-indigo-950/50 border border-indigo-200 dark:border-indigo-900/50 text-left overflow-hidden transition shadow-sm"
                            >
                              <div className="text-[11px] font-bold text-indigo-900 dark:text-indigo-300 line-clamp-1">{prog.title}</div>
                              <div className="text-[9px] text-slate-500 dark:text-slate-400 mt-0.5 line-clamp-2">{prog.description}</div>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          <ProgramModal program={selectedProgram} station={STATIONS.find(s => s.id === selectedProgram?.stationId)} onClose={() => setSelectedProgram(null)} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
